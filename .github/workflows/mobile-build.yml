name: Build Android APK

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Scaffold platform folders
        working-directory: mobile
        run: flutter create --platforms=android .

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: mobile
        run: flutter analyze || true

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maurya-automation-android
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/mobile-')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          name: Mobile ${{ github.ref_name }}
